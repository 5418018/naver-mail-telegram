name: Naver Mail Telegram

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: naver-mail-check
  cancel-in-progress: false

jobs:
  check-mail:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 네이버 메일 확인
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naver_mail.py

      - name: 처리 기록 저장
        run: |
          if [ -f processed_uidls.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add processed_uidls.txt

            if ! git diff --cached --quiet; then
              git commit -m "Update processed mail UIDLs"
              git push
            else
              echo "저장할 새로운 UIDL이 없습니다."
            fi
          fi
