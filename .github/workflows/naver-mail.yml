name: 네이버 Mail to Telegram
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: naver-mail-check
  cancel-in-progress: false
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 네이버 알림 및 읽음 처리
        env:
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naver_mail.py
      - name: 처리 기록 저장
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f naver_imap_state.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add naver_imap_state.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update naver notification state'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then git pull --rebase; sleep 3; fi
          done
          echo '::error::처리 기록 저장 실패. 중복 전송 가능성이 있습니다.'
          exit 1
